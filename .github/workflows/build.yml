# GitHub Actions pre ANGLICKÝ web (sportlinking.com).
# Stiahne aktuálne úplné dáta (data-full.json) zo slovenského webu a vygeneruje
# anglické stránky. Kedy beží (od Zadania 21 previerky 2, 4.11.2026):
#   - HLAVNE po každom builde SK webu — SK build (repozitár sport-linky, úloha
#     en-build) ho spustí sám cez workflow_dispatch (token EN_BUILD_TOKEN),
#     ručné spúšťanie už netreba,
#   - pri každej zmene v tomto repozitári (push do main),
#   - raz denne ako POISTKA (cron nižšie), keby spustenie zo SK zlyhalo.
# Sitemap lastmod = skutočná zmena stránky (od 2.10.2026, stav v sitemap-lastmod.json,
# commitne ho krok „Ulož dátumy zmien pre sitemap"). data.json sa NEcommituje.
# UMIESTNENIE V REPOZITÁRI: .github/workflows/build.yml

name: Build & Deploy (EN)

on:
  push:
    branches: [main]
  schedule:
    # len POISTKA: denne 4:41 UTC (5:41 v zime, 6:41 v lete u nás), neokrúhla minúta
    # (o celej hodine je GitHub preťažený). Hlavne EN build spúšťa SK build sám.
    - cron: "41 4 * * *"
  # workflow_dispatch MUSÍ ostať — cezeň EN build spúšťa SK build (úloha en-build)
  workflow_dispatch:

# Oprávnenia (bod 27 previerky): na úrovni celého workflow len čítanie;
# každá úloha dostane len to, čo naozaj potrebuje (pri úlohe nižšie).
permissions:
  contents: read

# Súbežnosť (bod 18) je nastavená pri ÚLOHÁCH, nie pre celý workflow — rušenie
# na úrovni workflow by zrušilo celý starší beh aj s rozbehnutým nasadením:
#   - build:  skupina pages-build, nový build zruší starší, ktorý ešte len stavia,
#   - deploy: skupina pages-deploy BEZ rušenia — nasadenie sa nikdy nepreruší.

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45   # bod 18: dáta + vlajky (max 10) + ikonky (max 15) + generátor a rezerva
    concurrency:
      group: pages-build
      cancel-in-progress: true   # nový build zruší starší, ktorý ešte len stavia
    permissions:
      contents: write   # commit sitemap-lastmod.json (dátumy zmien pre sitemap), ikony/ a vlajky/
      pages: read       # configure-pages zisťuje adresu webu (BASE_URL)
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main   # bod 8: vždy najnovší main (commity ikoniek/vlajok/sitemap idú do main)

      - uses: actions/configure-pages@v6
        id: pages

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Stiahni aktuálne dáta zo slovenského webu
        run: |
          # Prívesok ?build=... je zakaždým iný, takže sa obíde cache na ceste
          # (bez neho vracala sieť GitHubu staré dáta a EN web sa staval zo
          # starej verzie, kým sa cache sama neprečistila).
          # Od opravy 6 (body 3+13, 26.10.2026) je na SK webe data.json ODĽAHČENÝ
          # (bez anglických textov) — úplné dáta sú v data-full.json. Kým SK web
          # data-full.json ešte nemá, použije sa po starom data.json.
          # Adresa BEZ www (bod 30): web beží na sportlinky.sk, www išlo cez presmerovanie.
          curl -fsSL --retry 3 "https://sportlinky.sk/data-full.json?build=$GITHUB_RUN_ID" -o data.json \
            || curl -fsSL --retry 3 "https://sportlinky.sk/data.json?build=$GITHUB_RUN_ID" -o data.json
          # Poistka: odľahčené dáta (_lite) by zmazali anglické texty — build radšej zastav.
          python -c "import json,sys; d=json.load(open('data.json', encoding='utf-8')); sys.exit('CHYBA: stiahnuté dáta sú odľahčené (_lite), chýba data-full.json') if d.get('_lite') else print('data.json OK, verzia', d.get('version'), ',', len(d.get('nodes',[])), 'uzlov')"

      # AKTUÁLNE (Zadanie 16b, 3.11.2026): Aktuálne sú vo vlastnom súbore aktualne.json,
      # ktorý zadáva Miro cez admin na SK webe. Build si stiahne čerstvú kópiu zo SK
      # webu — generátor z nej vloží lištu do statického HTML (Google, návštevník bez
      # JavaScriptu) a priečinok Live This Week; zároveň ide na web ako záloha pre
      # appku (tá si súbor sťahuje priamo zo sportlinky.sk). Keď sa stiahnutie
      # nepodarí alebo súbor nie je platný JSON, súbor sa zmaže a generátor použije
      # pole "aktualne" z data.json alebo nič — build kvôli tomu NIKDY nespadne.
      # aktualne.json sa v tomto repozitári NEcommituje (je v .gitignore).
      # Krok je PRED vlajkami a ikonkami (Zadanie 17): ikony.py berie aj weby položiek
      # Aktuálnych (hosty_z_aktualnych) — bez súboru by ich ikonky na EN webe chýbali.
      # Priebežné commity vlajok a ikoniek aktualne.json nezachytia (je v .gitignore,
      # git pull --autostash ignorované súbory nemení).
      - name: Stiahni Aktuálne zo slovenského webu
        continue-on-error: true
        run: |
          curl -fsSL --retry 3 "https://sportlinky.sk/aktualne.json?build=$GITHUB_RUN_ID" -o aktualne.json || rm -f aktualne.json
          if [ -f aktualne.json ]; then
            python -c "import json; d=json.load(open('aktualne.json', encoding='utf-8')); assert isinstance(d.get('items'), list); print('aktualne.json OK, verzia', d.get('version'), ',', len(d['items']), 'položiek')" \
              || { echo "::warning::aktualne.json nie je platný — použije sa pole z data.json"; rm -f aktualne.json; }
          else
            echo "::warning::aktualne.json sa nepodarilo stiahnuť — použije sa pole z data.json (alebo nič)"
          fi

      # VLAJKY KRAJÍN (3.11.2026): vlajky sa sťahujú z flagcdn.com LEN tu, na serveri —
      # návštevník ich načíta z vlastného webu (/vlajky/). vlajky.py stiahne iba
      # CHÝBAJÚCE vlajky (všetky kódy z data.json × veľkosti z appky + 2× pre ostré
      # displeje) do vlajky/ a commitne ich „[skip ci]". Po prvom builde sa už nič
      # nesťahuje, len pri novej krajine. Build kvôli vlajkám NIKDY nespadne
      # (continue-on-error, timeout-minutes, skript vždy končí exit 0); chýbajúcu
      # vlajku generátor nahradí priehľadným obrázkom.
      # EN web: krok je ZA stiahnutím dát — kódy vlajok berie z práve stiahnutého
      # data.json (zo SK webu). Commituje sa LEN vlajky/, stiahnutý data.json NIE.
      - name: Stiahni vlajky krajín
        continue-on-error: true
        timeout-minutes: 10
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          python vlajky.py --git

      # IKONKY WEBOV (bod 15, 2.11.2026): ikonky sa sťahujú LEN tu, na serveri —
      # návštevník už nič neposiela Googlu ani Yandexu. Krok je ZA stiahnutím dát:
      # ikony.py berie weby z práve stiahnutého data.json (zo SK webu). Ak sa dáta
      # stiahnuť nepodarilo, predošlý krok build zastaví a sem sa nedôjde (nič sa
      # nemaže). Vlastné ikonky EN webu sa ukladajú do ikony/ v TOMTO repozitári
      # a PRIEBEŽNE (každé ~3 min) sa commitujú „[skip ci]" — commituje sa LEN
      # ikony/, stiahnutý data.json NIE. Limit 12 min — čo nestihne, dotiahne ďalší
      # build. Obnovujú sa LEN ikonky staršie ako 30 dní (max. 300 za build, bod 9).
      # Build kvôli ikonkám NIKDY nespadne (continue-on-error, timeout).
      - name: Stiahni ikonky webov
        continue-on-error: true
        timeout-minutes: 15
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          python ikony.py --git --limit 720

      - name: Vygeneruj anglické stránky
        run: python generator.py --out _site
        env:
          BASE_URL: ${{ steps.pages.outputs.base_url }}
          SITE_LANG: en
          GOAT_CODE: sportlinking

      # lastmod v sitemape podľa skutočnej zmeny (generator.py, od 2.10.2026):
      # generator zapíše sitemap-lastmod.json; ak sa zmenil, uloží sa do repozitára.
      # „[skip ci]" zabráni, aby tento commit spustil ďalší build. Zlyhanie
      # (napr. súbežný push) deploy NEZASTAVÍ — dátumy sa dorovnajú pri ďalšom builde.
      # Bod 8: keď „git pull --rebase" zlyhá, rebase sa zruší (žiadny polorozbitý
      # stav) a NEpushuje sa — len varovanie v logu.
      - name: Ulož dátumy zmien pre sitemap
        continue-on-error: true
        run: |
          if git status --porcelain -- sitemap-lastmod.json | grep -q .; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add sitemap-lastmod.json
            git commit -m "sitemap: dátumy zmien stránok [skip ci]"
            if git pull --rebase origin main; then
              git push || echo "::warning::git push sitemap-lastmod.json zlyhal — dorovná sa pri ďalšom builde"
            else
              git rebase --abort || true
              echo "::warning::git pull --rebase zlyhal — rebase zrušený, NEpushujem (dátumy sa dorovnajú pri ďalšom builde)"
            fi
          else
            echo "sitemap-lastmod.json bez zmeny"
          fi

      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    # bod 18: vlastná skupina BEZ rušenia — rozbehnuté nasadenie sa nikdy neprekuší,
    # ďalšie počká, kým dobehne.
    concurrency:
      group: pages-deploy
      cancel-in-progress: false
    permissions:
      pages: write      # nasadenie na GitHub Pages
      id-token: write   # overenie nasadenia (OIDC)
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v5
        id: deployment
