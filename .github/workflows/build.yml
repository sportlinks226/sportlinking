name: Build & Deploy (EN)

on:
  push:
    branches: [main]
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/configure-pages@v5
        id: pages

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Stiahni data
        run: |
          curl -fsSL --retry 3 "https://www.sportlinky.sk/data.json" -o data.json
          python -c "import json; d=json.load(open('data.json')); print('OK', d.get('version'))"

      - name: Generuj stranky
        run: python generator.py --out _site
        env:
          BASE_URL: ${{ steps.pages.outputs.base_url }}
          SITE_LANG: en
          GOAT_CODE: sportlinking

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
